<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000"/>
  <!-- Ring (back half visible above planet) -->
  <ellipse cx="16" cy="17" rx="13" ry="3.5" fill="none" stroke="#ffcc33" stroke-width="2"/>
  <!-- Planet -->
  <circle cx="16" cy="17" r="7.5" fill="#ff3399"/>
  <!-- Highlight on planet -->
  <circle cx="13" cy="14" r="2.5" fill="#ffb3d9" opacity="0.7"/>
  <!-- Ring front (arc beneath the planet to complete the orbit) -->
  <path d="M 4.5 18.5 Q 16 22 27.5 18.5" fill="none" stroke="#ffcc33" stroke-width="2"/>
</svg>
