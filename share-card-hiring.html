<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Bowlby+One&family=VT323&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body {
    position: relative;
    color: #fff;
    font-family: "Bungee", "Impact", sans-serif;
    text-align: center;
  }
  /* Starfield */
  .stars {
    position: absolute; inset: 0;
    background:
      radial-gradient(2px 2px at 80px 60px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 220px 110px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 340px 50px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 540px 90px, #fff 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 720px 40px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 960px 110px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 1080px 70px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 120px 280px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 380px 340px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 640px 380px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 880px 260px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 1120px 350px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60px 480px, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 320px 550px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 550px 510px, #fff 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 800px 580px, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 1020px 540px, #fff 50%, transparent 51%);
  }
  .shooting {
    position: absolute;
    top: 80px; left: 220px;
    width: 90px; height: 2px;
    background: linear-gradient(90deg, transparent, #ffcc00);
    transform: rotate(-30deg);
    opacity: 0.85;
  }

  /* Planets */
  .planet { position: absolute; border-radius: 50%; box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5); }
  .p-purple {
    width: 110px; height: 110px;
    top: 22px; right: 36px;
    background: radial-gradient(circle at 30% 30%, #c397ff, #6c4cb8 60%, #3a2666);
  }
  .p-purple::after {
    content: ""; position: absolute;
    width: 180px; height: 28px;
    border: 8px solid #d4a8ff;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-18deg);
    box-sizing: border-box;
    opacity: 0.75;
  }
  .p-jupiter {
    width: 100px; height: 100px;
    top: 32px; left: 60px;
    background:
      radial-gradient(circle at 35% 35%, #ffd99e, #c97c2e 55%, #6f3d10),
      repeating-linear-gradient(180deg, rgba(0,0,0,0.15) 0 5px, transparent 5px 12px);
    background-blend-mode: multiply, normal;
  }
  .p-pink {
    width: 95px; height: 95px;
    bottom: 90px; right: 52px;
    background: radial-gradient(circle at 35% 35%, #ff7fc8, #ff3399 55%, #8b0a4b);
    box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5), 0 0 50px rgba(255,51,153,0.65);
  }
  .p-pink::after {
    content: ""; position: absolute;
    width: 160px; height: 25px;
    border: 7px solid #ffaad6;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(20deg);
    box-sizing: border-box;
    opacity: 0.85;
  }
  .p-tiny-pink {
    width: 50px; height: 50px;
    bottom: 60px; left: 80px;
    background: radial-gradient(circle at 35% 35%, #ff7fc8, #ff3399 60%, #8b0a4b);
    box-shadow: 0 0 30px rgba(255,51,153,0.55);
  }

  /* Content stack */
  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 90px 60px 80px;
    z-index: 3;
  }
  .eyebrow {
    color: #ffcc00;
    font-size: 38px;
    letter-spacing: 5px;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 #ff3399;
    margin-bottom: 30px;
  }
  .hero {
    color: #ff3399;
    font-size: 100px;
    line-height: 0.95;
    letter-spacing: 2px;
    -webkit-text-stroke: 3px #000;
    paint-order: stroke fill;
    text-shadow:
      6px 6px 0 #ffcc00,
      11px 11px 0 #4a002a;
    margin-bottom: 30px;
  }
  .twist {
    color: #fff5d6;
    font-size: 28px;
    letter-spacing: 3px;
    margin-bottom: 14px;
    text-shadow: 2px 2px 0 #000;
    font-family: "VT323", "Bungee", monospace;
    text-transform: lowercase;
    font-style: italic;
    opacity: 0.95;
  }
  .rule {
    color: #ffcc00;
    font-size: 22px;
    letter-spacing: 4px;
    text-shadow: 2px 2px 0 #000;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 26px; left: 0; right: 0;
    text-align: center;
    color: #fff5d6;
    font-size: 32px;
    letter-spacing: 5px;
    -webkit-text-stroke: 1.5px #000;
    paint-order: stroke fill;
    text-shadow: 3px 3px 0 #ff3399;
    white-space: nowrap;
    z-index: 4;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="shooting"></div>
  <div class="planet p-jupiter"></div>
  <div class="planet p-purple"></div>
  <div class="planet p-pink"></div>
  <div class="planet p-tiny-pink"></div>

  <div class="stack">
    <div class="eyebrow">★ NOW HIRING ★</div>
    <div class="hero">VIRAL CREATIVE<br>PRODUCER</div>
    <div class="rule">SCORE 9/10 TO UNLOCK THE APPLICATION</div>
  </div>

  <div class="footer">★ TAKE THE INTERNET TASTE TEST ★</div>
</body>
</html>
